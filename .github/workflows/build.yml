name: Build Windows & Linux Executables

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:  # Adds a manual "Run workflow" button on GitHub

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log commit being built
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Building ref: ${{ github.ref_name }} (${SHORT_SHA})"
          git log -1 --oneline
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tkinter support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Build executable
        run: pyinstaller --clean --noconfirm bbc_sounds_program.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbc-sounds-${{ runner.os }}-${{ steps.meta.outputs.short_sha }}
          path: dist/
